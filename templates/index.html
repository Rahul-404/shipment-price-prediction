<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shipping Cost Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
  </head>
  <body>

    <!-- Header with About Me -->
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div>
          <h2>Shipping Cost Prediction</h2>
          <p class="mb-0">Created by Rahul Shelke — Passionate Data Scientist | ML & AI Enthusiast</p>
        </div>
        <div>
          <a href="#footer" class="btn btn-outline-light">Connect With Me</a>
        </div>
      </div>
    </header>

    <section>
            <div class="container">
                <form action="/" method="post">

                    <div class="row g-3">

                      <!-- Row 1 -->
                      <div class="col-md-6">
                          <div class="mb-3">
                            <label for="artist">artist reputation</label>
                            <input type="number" class="form-control" id="artist" name="artist" placeholder="float" required="required">
                          </div>
                      </div>
                      <div class="col-md-6">
                          <div class="mb-3">
                            <label for="height">height</label>
                            <input type="number" class="form-control" id="height" name="height" placeholder="float" required="required">
                          </div>
                      </div>

                      <!-- Row 2 -->
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="width">width</label>
                          <input type="number" class="form-control" id="width" name="width" placeholder="float" required="required">
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="weight">weight</label>
                          <input type="number" class="form-control" id="weight" name="weight" placeholder="float" required="required">
                        </div>
                      </div>

                      <!-- Row 3 -->
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="material">Select material</label>
                          <select class="form-control" id="material" name="material" placeholder="material" required="required">
                            <option value="" disabled selected>material</option>
                            <option>Aluminium</option>
                            <option>Marble</option>
                            <option>Bronze</option>
                            <option>Clay</option>
                            <option>Brass</option>
                            <option>Wood</option>
                            <option>Stone</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="priceOfSculpture">Price of Sculpture</label>
                          <input type="number" class="form-control" id="priceOfSculpture" name="priceOfSculpture" placeholder="float" required="required">
                        </div>
                      </div>

                      <!-- Row 4 -->
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="baseShippingPrice">Base Shipping Price</label>
                          <input type="number" class="form-control" id="baseShippingPrice" name="baseShippingPrice" placeholder="float" required="required">
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="international">international</label>
                          <select class="form-control" id="international" name="international" placeholder="international" required="required">
                            <option value="" disabled selected>international</option>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </div>
                      </div>

                      <!-- Row 5 -->
                      <div class="col-md-6">                        
                        <div class="mb-3">
                          <label for="expressShipment">Express Shipment:</label>
                          <select class="form-control" id="expressShipment" name="expressShipment" placeholder="expressShipment" required="required">
                            <option value="" disabled selected>expressShipment</option>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="installationIncluded">Installation Included</label>
                          <select class="form-control" id="installationIncluded" name="installationIncluded" placeholder="installationIncluded" required="required">
                            <option value="" disabled selected>installationIncluded</option>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </div>
                      </div>
           
                      <!-- Row 6 -->
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="transport">Transport</label>
                          <select class="form-control" id="transport" name="transport" placeholder="transport" required="required">
                            <option value="" disabled selected>transport</option>
                            <option>Airways</option>
                            <option>Roadways</option>
                            <option>Waterways</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="fragile">Fragile</label>
                          <select class="form-control" id="fragile" name="fragile" placeholder="fragile" required="required">
                            <option value="" disabled selected>fragile</option>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </div>
                      </div>

                      <!-- Row 7 -->
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="customerInformation">Customer Information</label>
                          <select class="form-control" id="customerInformation" name="customerInformation" placeholder="customerInformation" required="required">
                            <option value="" disabled selected>customerInformation</option>
                            <option>Wealthy</option>
                            <option>Working Class</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="remoteLocation">Remote Location</label>
                          <select class="form-control" id="remoteLocation" name="remoteLocation" placeholder="remoteLocation" required="required">
                            <option value="" disabled selected>remoteLocation</option>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </div>
                      </div>

                        <input class="btn btn-primary" type="submit" value="Predict" required />
                    </div>
        
                </form>
            </div>
            <!-- Prediction Output -->
            <div class="text-center text-black">
                <h2 class="display-4 fw-bolder">The shipment cost is  {{ context }} </h2>
            </div>

    </section>

    <!-- Footer with Social Links -->
    <footer id="footer" class="bg-light text-center text-black py-4 mt-5">
      <div class="container">
        <h5>Connect With Me</h5>
        <div class="social-icons">
          <a href="https://github.com/Rahul-404/" target="https://github.com/Rahul-404/" title="GitHub"><i class="bi bi-github"></i> GitHub</a>
          <a href="https://linkedin.com/in/rahulshelke981/" target="https://linkedin.com/in/rahulshelke981/" title="LinkedIn"><i class="bi bi-linkedin"></i> LinkedIn</a>
          <!-- <a href="https://youtube.com/yourchannel" target="_blank" title="YouTube"><i class="bi bi-youtube"></i> YouTube</a> -->
          <a href="https://medium.com/@yourusername" target="_blank" title="Medium"><i class="bi bi-medium"></i> Medium</a>
        </div>
        <p class="mt-2">© {{ current_year }} Rahul Shelke — All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- JS Scripts -->
    <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
    <script type="text/javascript">
        $(".input").focus(function(){
            $(this).parent().addClass("focus");
        }).blur(function(){
            if($(this).val() === ''){
                $(this).parent().removeClass("focus");
            }
        })
    </script>
  </body>
</html>
